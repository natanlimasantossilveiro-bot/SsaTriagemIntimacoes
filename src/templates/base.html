<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SsaTriagemIntimações{% endblock %}</title>
  <style>
    :root {
      --cor-fundo: #f4f5f7;
      --cor-cartao: #ffffff;
      --cor-texto: #1f2430;
      --cor-texto-suave: #5b6270;
      --cor-borda: #dde1e7;
      --cor-primaria: #2f4f7f;
      --cor-primaria-hover: #253f66;
      --cor-erro: #b3261e;
      --cor-erro-fundo: #fdecea;
      --cor-sucesso-fundo: #eaf6ec;
      --cor-sucesso-borda: #bfe3c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--cor-fundo);
      color: var(--cor-texto);
    }
    header {
      background: var(--cor-primaria);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 1.1rem;
      margin: 0;
      font-weight: 600;
    }
    header a {
      color: #dfe6f2;
      text-decoration: none;
      font-size: 0.9rem;
    }
    header a:hover { text-decoration: underline; }
    .nav-header { display: flex; align-items: center; gap: 20px; }
    main {
      max-width: 640px;
      margin: 48px auto;
      padding: 0 20px;
    }
    .cartao {
      background: var(--cor-cartao);
      border: 1px solid var(--cor-borda);
      border-radius: 10px;
      padding: 32px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--cor-borda);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      margin-top: 24px;
      background: var(--cor-primaria);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--cor-primaria-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .aviso-erro {
      background: var(--cor-erro-fundo);
      color: var(--cor-erro);
      border: 1px solid #f2c1bd;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .status-processando {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--cor-texto-suave);
      display: none;
    }
    .resultado {
      background: var(--cor-sucesso-fundo);
      border: 1px solid var(--cor-sucesso-borda);
      border-radius: 8px;
      padding: 20px;
      margin-top: 24px;
    }
    .resultado h3 {
      margin-top: 0;
      font-size: 1rem;
    }
    .resumo-lista {
      list-style: none;
      padding: 0;
      margin: 12px 0 20px;
    }
    .resumo-lista li {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #d8ecdb;
      font-size: 0.92rem;
    }
    .resumo-lista li:last-child { border-bottom: none; }
    .botao-download {
      display: inline-block;
      background: var(--cor-primaria);
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .botao-download:hover { background: var(--cor-primaria-hover); }
    .rodape-usuario {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--cor-texto-suave);
    }
    .aviso-sucesso {
      background: var(--cor-sucesso-fundo);
      color: #1e5c2a;
      border: 1px solid var(--cor-sucesso-borda);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    table.tabela-usuarios {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.92rem;
    }
    table.tabela-usuarios th {
      text-align: left;
      font-size: 0.8rem;
      color: var(--cor-texto-suave);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 8px 6px;
      border-bottom: 2px solid var(--cor-borda);
    }
    table.tabela-usuarios td {
      padding: 10px 6px;
      border-bottom: 1px solid var(--cor-borda);
      vertical-align: middle;
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #eceff3;
      color: var(--cor-texto-suave);
    }
    .badge-admin {
      background: #e4ecfb;
      color: var(--cor-primaria);
    }
    .botao-remover {
      margin-top: 0;
      background: transparent;
      color: var(--cor-erro);
      border: 1px solid #f2c1bd;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .botao-remover:hover { background: var(--cor-erro-fundo); }
    .campo-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      margin-top: 16px;
    }
    .campo-checkbox input { width: auto; }
    hr.separador {
      border: none;
      border-top: 1px solid var(--cor-borda);
      margin: 28px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>SsaTriagemIntimações</h1>
    {% if usuario %}
      <nav class="nav-header">
        {% if eh_admin %}
          <a href="/admin/usuarios">Gerenciar usuários</a>
        {% endif %}
        <a href="/logout">Sair ({{ usuario }})</a>
      </nav>
    {% endif %}
  </header>
  <main>
    <div class="cartao">
      {% block conteudo %}{% endblock %}
    </div>
  </main>
</body>
</html>
